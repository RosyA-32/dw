<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Manager · Tabla interactiva</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app">
        <header>
            <h1><i class="fas fa-table"></i> Data Manager</h1>
            <p>Gestiona tus elementos: ordena, filtra, edita o elimina</p>
        </header>

        <main>
            
            <div class="card form-card">
                <h2><i class="fas fa-pen"></i> <span id="formTitle">Nuevo elemento</span></h2>
                <form id="itemForm">
                    <input type="hidden" id="itemId">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="name"><i class="fas fa-tag"></i> Nombre</label>
                            <input type="text" id="name" placeholder="Ej: iPhone 13" required>
                        </div>
                        <div class="form-group">
                            <label for="category"><i class="fas fa-folder"></i> Categoría</label>
                            <select id="category" required>
                                <option value="">Seleccionar</option>
                                <option value="Electrónica">Electrónica</option>
                                <option value="Libro">Libro</option>
                                <option value="Ropa">Ropa</option>
                                <option value="Hogar">Hogar</option>
                                <option value="Juguete">Juguete</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="year"><i class="fas fa-calendar"></i> Año</label>
                            <input type="number" id="year" min="1900" max="2100" placeholder="2023" required>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn primary" id="submitBtn"><i class="fas fa-save"></i> Guardar</button>
                        <button type="button" class="btn secondary" id="cancelBtn"><i class="fas fa-times"></i> Cancelar</button>
                    </div>
                </form>
            </div>

            <!-- Filtro y tabla -->
            <div class="card table-card">
                <div class="table-header">
                    <h2><i class="fas fa-list"></i> Elementos</h2>
                    <div class="filter-wrapper">
                        <i class="fas fa-search"></i>
                        <input type="text" id="filterInput" placeholder="Buscar por nombre, categoría o año...">
                    </div>
                </div>

                <div class="table-responsive">
                    <table id="dataTable">
                        <thead>
                            <tr>
                                <th data-sort="name">Nombre <span class="sort-icon"></span></th>
                                <th data-sort="category">Categoría <span class="sort-icon"></span></th>
                                <th data-sort="year">Año <span class="sort-icon"></span></th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                        
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
