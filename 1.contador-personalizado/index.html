<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador Interactivo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="card">
        <h1 class="title">CONTADOR DINÁMICO</h1>
        
        <div class="counter-box">
            <span class="counter-value" id="mainCounter">0</span>
        </div>

        <div class="button-group">
            <button class="btn btn-increment" id="incrementBtn">+1</button>
            <button class="btn btn-decrement" id="decrementBtn">-1</button>
        </div>

        <div class="stats">
            <div class="stat-item">
                <span class="stat-label">Incrementos</span>
                <span class="stat-number" id="incrementClicks">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Decrementos</span>
                <span class="stat-number" id="decrementClicks">0</span>
            </div>
        </div>

        <p class="info-text">Los contadores laterales se reinician al llegar a 10</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
